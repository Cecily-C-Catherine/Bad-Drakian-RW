name: Compile changelogs

on:
  push:
    branches:
      - main
    paths:
      - "html/changelogs/*.yml"
      - ".github/workflows/compile_changelogs.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: compile-changelogs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  compile:
    name: "Compile changelogs"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Previous opt-in gate retained for reference. When ACTION_ENABLER was
      # absent, every dependent step was skipped despite a successful job result.
      # Compilation now runs without that secret; the original gate is disabled.
      # - name: "Check for ACTION_ENABLER secret and pass true to output if it exists to be checked by later steps"
      #   id: value_holder
      #   env:
      #     ENABLER_SECRET: ${{ secrets.ACTION_ENABLER }}
      #   run: |
      #     unset SECRET_EXISTS
      #     if [ -n "$ENABLER_SECRET" ]; then SECRET_EXISTS=true ; fi
      #     echo "ACTIONS_ENABLED=$SECRET_EXISTS" >> $GITHUB_OUTPUT

      - name: Generate App Token
        id: app-token-generation
        uses: actions/create-github-app-token@v3
        if: env.APP_PRIVATE_KEY != '' && env.APP_ID != ''
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_ID: ${{ secrets.APP_ID }}

      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app-token-generation.outputs.token || secrets.GITHUB_TOKEN }}

      - name: "Setup python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: "Install deps"
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Compile and publish changelogs
        shell: bash
        run: |
          git config --local user.name "ratwood-ci[bot]"
          git config --local user.email "179393467+ratwood-ci[bot]@users.noreply.github.com"
          # Recompile from current main if another commit arrives before our push.
          # This is the disposable runner checkout, not a developer's working tree.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/ss13_genchangelog.py html/changelogs
            git add -- html/changelogs
            if git diff --cached --quiet; then
              echo "No pending changelog changes."
              exit 0
            fi
            git commit -m "Automatic changelog compile [ci skip]"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Unable to publish compiled changelogs after three attempts." >&2
          exit 1

      # Previous checkout retained for reference. The active checkout above uses
      # main explicitly and persists the selected token for the native git push.
      # - name: "Checkout"
      #   if: steps.value_holder.outputs.ACTIONS_ENABLED
      #   uses: actions/checkout@v6
      #   with:
      #     fetch-depth: 25
      #     persist-credentials: false

      # The following secret-dependent condition also previously guarded Setup
      # python and Install deps. It is disabled for the same reason as the gate.
      # if: steps.value_holder.outputs.ACTIONS_ENABLED

      # Previous separate compile/commit steps retained for reference. The active
      # combined step recompiles from fresh main after a rejected push, handles an
      # empty diff explicitly, and reports commit errors rather than hiding them.
      # - name: "Compile"
      #   if: steps.value_holder.outputs.ACTIONS_ENABLED
      #   run: |
      #     python tools/ss13_genchangelog.py html/changelogs
      # - name: Commit
      #   if: steps.value_holder.outputs.ACTIONS_ENABLED
      #   run: |
      #     git config --local user.name "ratwood-ci[bot]"
      #     git config --local user.email "179393467+ratwood-ci[bot]@users.noreply.github.com"
      #     git pull origin main
      #     git add html/changelogs
      #     git commit -m "Automatic changelog compile [ci skip]" -a || true

      # Previous push action retained for reference. The active step uses native
      # git with bounded retries, so concurrent main updates are handled together
      # with recompilation instead of publishing an outdated compiled archive.
      # - name: "Push"
      #   if: steps.value_holder.outputs.ACTIONS_ENABLED
      #   uses: ad-m/github-push-action@master
      #   with:
      #     github_token: ${{ steps.app-token-generation.outputs.token || secrets.GITHUB_TOKEN }}
